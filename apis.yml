name: GuildFi
description: 'GuildFi was a Web3 gaming platform and guild that aggregated blockchain
  games, quests, achievements, and rewards into a single account layer, letting players
  discover games and earn across the play-to-earn ecosystem (native token GF). It
  was backed by Pantera Capital, Coinbase Ventures, Animoca Brands, and other crypto
  investors. In 2024 GuildFi rebranded and consolidated into Zentry (zentry.com), a
  self-described "Human-Agentic OS" spanning gaming (Radiant), a data layer (zData),
  an agent layer (zAI), and the ZENT token. The original guildfi.com domain is now
  defunct (expired TLS certificate, 404s) and GuildFi/Zentry publishes no public API,
  developer portal, OpenAPI, SDKs, or agent surface as of this enrichment pass. This
  record is a portfolio-lead stub retained for lineage; see x-successor for the live
  entity.'
